[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotwin"
version = "0.1.0"
description = "Field-level crop-rotation risk simulator built on NASA Earth observation data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "segno>=1.6",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "jsonschema[format]>=4.22",
]

[tool.setuptools.packages.find]
include = [
  "agrotwin*",
  "contracts*",
  "ingest*",
  "engine*",
  "api*",
  "scout*",
  "council*",
  "qa*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
